name: build

on: [ push, pull_request, workflow_dispatch ]

env: { CARGO_TERM_COLOR: always }

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: snickerbockers/submodules-init@v4
      - run: 'cargo build --verbose'
      - run: 'cargo test --verbose'
